name: Deploy

on:
  push:
    branches: [master, dev]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH_OPTS: -i /home/runner/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Setup SSH
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" > /dev/null \
            && echo "kalit formati to'g'ri" \
            || { echo "SSH_PRIVATE_KEY secret noto'g'ri (BEGIN/END qatorlari bilan to'liq private kalit kerak)"; exit 1; }
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> "$HOME/.ssh/known_hosts" || true

      - name: Verify SSH connection
        run: |
          ssh $SSH_OPTS -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            'echo "ulanish OK: $(hostname), node $(node -v)"'

      - name: Upload build to server
        run: |
          rsync -az --delete \
            -e "ssh $SSH_OPTS -p ${{ secrets.SSH_PORT }}" \
            --exclude 'node_modules' --exclude '.env' \
            --exclude 'uploads' --exclude 'logs' \
            dist public prisma generated package.json pnpm-lock.yaml \
            ecosystem.config.js prisma.config.ts \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Install prod deps, migrate & restart
        run: |
          ssh $SSH_OPTS -p "${{ secrets.SSH_PORT }}" \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' bash -s" < deploy/remote-deploy.sh

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "http://${{ secrets.SSH_HOST }}:${{ secrets.PUBLIC_PORT }}/api/v1/docs" || true)
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "Health check muvaffaqiyatsiz"; exit 1

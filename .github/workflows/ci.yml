name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (web)
        run: pnpm lint:web
        continue-on-error: true

      - name: Typecheck (web)
        run: pnpm typecheck:web

      - name: Build (nest)
        run: pnpm build

      - name: Web tests
        run: pnpm test:web

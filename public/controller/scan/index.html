<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Skanerlash — Chipta</title>
<script src="/js/boot.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/css/ds.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/controller.css">
<script type="module" src="/js/pages/scan.js"></script>
</head>
<body>
<main class="capp scan">
  <div class="scanhead">
    <a href="/controller/" aria-label="Tadbirlarga qaytish">←</a>
    <div><div class="t" id="event-title">Skanerlash</div><div class="v" id="event-date"></div></div>
  </div>
  <div class="scanframe" id="scanframe">
    <video id="video" playsinline muted hidden></video>
    <div class="scanbox" aria-hidden="true">
      <span class="scancorner tl"></span><span class="scancorner tr"></span><span class="scancorner bl"></span><span class="scancorner br"></span>
    </div>
    <p class="scanhint" id="scanhint" role="status">QR kodni ramkaga joylashtiring</p>
  </div>
  <form class="manual" id="manual" novalidate>
    <label for="code">Kodni qo'lda kiritish</label>
    <input class="input" id="code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="c0ffee00-1234-4abc-9def-001122334455">
    <button class="btn btn-primary btn-block" id="check" type="submit">Tekshirish</button>
  </form>
</main>
<div class="result" id="result" role="alertdialog" aria-modal="true" aria-labelledby="result-title" hidden>
  <div class="ricon" id="result-icon" aria-hidden="true"></div>
  <h2 class="rtitle" id="result-title"></h2>
  <div class="rmeta" id="result-meta"></div>
  <button class="rback" id="result-next" type="button">Keyingi chiptani skanerlash</button>
</div>
</body>
</html>

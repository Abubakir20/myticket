<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Admin panel — Chipta</title>
<script src="/js/boot.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/css/ds.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/account.css">
<link rel="stylesheet" href="/css/admin.css">
<script type="module" src="/js/pages/admin.js"></script>
</head>
<body>
<header id="topnav"></header>
<main class="wrap admin">
  <section class="ahero" aria-labelledby="admin-title">
    <div class="kicker">Boshqaruv paneli</div>
    <h1 id="admin-title">Admin panel</h1>
    <p class="ahero-sub" id="admin-sub">Platformadagi tadbirlar va tashkilotchi arizalarini shu yerdan boshqarasiz.</p>
  </section>

  <section class="stats" id="stats" aria-label="Statistika"></section>

  <div class="tabs" role="tablist" aria-label="Bo'limlar">
    <button class="tab" role="tab" id="tab-events" aria-controls="panel-events" aria-selected="true" type="button">Tadbirlar<span class="count" id="count-events"></span></button>
    <button class="tab" role="tab" id="tab-apps" aria-controls="panel-apps" aria-selected="false" tabindex="-1" type="button">Arizalar<span class="count" id="count-apps"></span></button>
  </div>

  <section class="apanel" id="panel-events" role="tabpanel" aria-labelledby="tab-events">
    <div class="chips" id="event-filters" role="group" aria-label="Tadbir holati"></div>
    <div id="event-list"></div>
  </section>

  <section class="apanel" id="panel-apps" role="tabpanel" aria-labelledby="tab-apps" hidden>
    <div class="chips" id="app-filters" role="group" aria-label="Ariza holati"></div>
    <div id="app-list"></div>
  </section>
</main>
<footer id="footer"></footer>

<div class="modalbg" id="action-modal" hidden>
  <form class="modal amodal" id="action-form" role="dialog" aria-modal="true" aria-labelledby="action-title" novalidate>
    <h4 id="action-title"></h4>
    <p class="modal-sub" id="action-sub"></p>
    <div class="field" id="action-field">
      <label for="action-reason" id="action-label">Sabab</label>
      <textarea class="input" id="action-reason" maxlength="500" rows="3"></textarea>
    </div>
    <div class="banner" id="action-banner" role="alert" hidden></div>
    <div class="amodal-actions">
      <button class="btn btn-secondary" type="button" id="action-cancel">Bekor qilish</button>
      <button class="btn btn-primary" type="submit" id="action-submit">Tasdiqlash</button>
    </div>
  </form>
</div>
</body>
</html>
